<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdowns</title>
<style>
  :root {
    --bg: #0a0a12;
    --panel: #12121e;
    --neon: #00f0ff;
    --neon2: #ff00e6;
    --neon3: #7cff00;
    --text: #e0e6ff;
    --muted: #7a7f9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(circle at 20% 10%, #1a0033 0%, #0a0a12 40%, #000 100%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(0,240,255,.5), transparent),
      radial-gradient(2px 2px at 70% 60%, rgba(255,0,230,.5), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(124,255,0,.4), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(0,240,255,.4), transparent);
    pointer-events: none;
    animation: twinkle 6s infinite alternate;
    z-index: 0;
  }
  @keyframes twinkle { from { opacity: .4; } to { opacity: 1; } }

  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 24px; }

  header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  h1 {
    font-size: 2rem; margin: 0;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(0,240,255,.3);
    letter-spacing: 2px;
  }
  .add-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: transparent; color: var(--neon);
    border: 2px solid var(--neon);
    font-size: 2rem; line-height: 1; cursor: pointer;
    box-shadow: 0 0 12px var(--neon), inset 0 0 12px rgba(0,240,255,.2);
    transition: transform .2s, box-shadow .2s;
    display: none; align-items: center; justify-content: center;
  }
  .add-btn:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 0 24px var(--neon); }
  .add-btn.visible { display: flex; }

  /* Form */
  .form-panel {
    background: rgba(18,18,30,.85);
    border: 1px solid rgba(0,240,255,.25);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 30px rgba(0,240,255,.08), inset 0 0 30px rgba(0,240,255,.03);
    margin-bottom: 32px;
    backdrop-filter: blur(6px);
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .form-panel.hidden { display: none; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  input[type="text"], input[type="datetime-local"], select {
    background: #0a0a14; color: var(--text);
    border: 1px solid #2a2a44; border-radius: 10px;
    padding: 12px 14px; font-size: 1rem; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(0,240,255,.4); }
  select {
    appearance: none;
    cursor: pointer;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--neon) 50%),
      linear-gradient(135deg, var(--neon) 50%, transparent 50%);
    background-position:
      calc(100% - 20px) calc(50% - 3px),
      calc(100% - 14px) calc(50% - 3px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 40px;
  }
  select option { background: #0a0a14; color: var(--text); }

  /* Switch */
  .switch-row { display: flex; align-items: center; gap: 12px; }
  .switch { position: relative; width: 52px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer; border-radius: 28px;
    background: #1e1e30; border: 1px solid #333; transition: .3s;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: #888; border-radius: 50%; transition: .3s;
  }
  .switch input:checked + .slider {
    background: rgba(0,240,255,.2); border-color: var(--neon);
    box-shadow: 0 0 12px rgba(0,240,255,.5);
  }
  .switch input:checked + .slider::before {
    transform: translateX(24px); background: var(--neon);
    box-shadow: 0 0 10px var(--neon);
  }

  /* Dropzone */
  .dropzone {
    border: 2px dashed #2a2a44; border-radius: 12px; padding: 24px;
    text-align: center; color: var(--muted); cursor: pointer;
    transition: border-color .2s, background .2s; position: relative; min-height: 90px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .dropzone.drag { border-color: var(--neon2); background: rgba(255,0,230,.06); box-shadow: 0 0 20px rgba(255,0,230,.3); }
  .dropzone img.preview { max-height: 120px; border-radius: 8px; box-shadow: 0 0 16px rgba(0,240,255,.4); }

  button.primary {
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    color: #050510; font-weight: 700; font-size: 1rem;
    border: none; border-radius: 10px; padding: 14px 28px; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,240,255,.4);
    transition: transform .15s, box-shadow .2s;
  }
  button.primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(255,0,230,.6); }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid #2a2a44;
    border-radius: 10px; padding: 14px 20px; cursor: pointer; transition: color .2s, border-color .2s;
  }
  button.ghost:hover { color: var(--text); border-color: var(--neon); }
  .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }

  /* Countdown cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .card {
    background: rgba(18,18,30,.9);
    border: 1px solid rgba(0,240,255,.2);
    border-radius: 18px; overflow: hidden; position: relative;
    box-shadow: 0 0 24px rgba(0,240,255,.06);
    transition: transform .2s, box-shadow .3s;
    display: flex; flex-direction: column;
  }
  .card:hover { box-shadow: 0 0 36px rgba(255,0,230,.2); }
  .card .thumb {
    width: 100%; height: 200px; object-fit: cover;
    background: #08080f; display: block;
    border-bottom: 1px solid rgba(0,240,255,.15);
  }
  .card .body { padding: 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .card .title-row { display: flex; align-items: flex-start; gap: 8px; }
  .card h2 { margin: 0; font-size: 1.25rem; color: #fff; flex: 1; word-break: break-word; }
  .card .repeat-badge {
    font-size: .65rem; padding: 3px 8px; border-radius: 999px;
    background: rgba(124,255,0,.15); color: var(--neon3);
    border: 1px solid rgba(124,255,0,.4); white-space: nowrap; text-transform: uppercase;
  }
  .card .meta { font-size: .65rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .card .clock { font-size: 2.1rem; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .card .clock small { font-size: .8rem; color: var(--muted); font-weight: 400; margin-left: 4px; letter-spacing: 0; }
  .card .status { font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .card .status.waiting { color: var(--neon); text-shadow: 0 0 14px rgba(0,240,255,.7); animation: pulse 2s infinite; }
  .card .status.expired { color: var(--neon2); text-shadow: 0 0 14px rgba(255,0,230,.7); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .progress-wrap {
    height: 8px; background: #1a1a2c; border-radius: 999px; overflow: hidden; position: relative;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon), var(--neon2), var(--neon3));
    background-size: 200% 100%;
    animation: flow 2s linear infinite;
    box-shadow: 0 0 12px var(--neon);
    transition: width .3s linear;
  }
  @keyframes flow { from { background-position: 0% 0; } to { background-position: 200% 0; } }
  .card .del {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,0,230,.5);
    cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s, box-shadow .2s;
  }
  .card:hover .del { opacity: 1; }
  .card .del:hover { box-shadow: 0 0 12px var(--neon2); }

  .card .edit {
    position: absolute; top: 10px; left: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: var(--neon); border: 1px solid rgba(0,240,255,.5);
    cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s, box-shadow .2s;
  }
  .card:hover .edit { opacity: 1; }
  .card .edit:hover { box-shadow: 0 0 12px var(--neon); }

  .empty { color: var(--muted); text-align: center; padding: 40px; grid-column: 1/-1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⏱ COUNTDOWNS</h1>
    <button class="add-btn" id="addBtn" title="Neuen Countdown erstellen">+</button>
  </header>

  <!-- Formular -->
  <section class="form-panel hidden" id="formPanel">
    <form id="createForm">
      <div class="form-grid">
        <!-- Vorlagen-Dropdown -->
        <div class="field full" id="templateField">
          <label for="templateSelect">Vorlage wählen</label>
          <select id="templateSelect">
            <option value="">– Keine Vorlage (manuell) –</option>
          </select>
        </div>

        <div class="field full">
          <label for="title">Titel</label>
          <input type="text" id="title" required>
        </div>
        <div class="field">
          <label for="start">Start</label>
          <input type="datetime-local" id="start" required>
        </div>
        <div class="field">
          <label for="end">Ende</label>
          <input type="datetime-local" id="end" required>
        </div>
        <div class="field full">
          <label>Bild (Auswahl, Drag&amp;Drop oder Strg+V)</label>
          <div class="dropzone" id="dropzone" tabindex="0">
            <span id="dropText">Klicken, Datei hierher ziehen oder Strg+V einfügen</span>
          </div>
        </div>
        <div class="field full">
          <div class="switch-row">
            <label class="switch">
              <input type="checkbox" id="repeat">
              <span class="slider"></span>
            </label>
            <span>Wiederholung (täglich neu starten)</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="cancelBtn">Abbrechen</button>
        <button type="submit" class="primary" id="submitBtn">Countdown erstellen</button>
      </div>
    </form>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </section>

  <!-- Countdown Liste -->
  <section class="cards" id="cards"></section>
</div>

<script>
(() => {
  const DB_NAME = 'neon-countdowns';
  const STORE = 'countdowns';
  let db = null;
  let currentImageBlob = null;
  let currentImageUrl = null;
  let countdowns = [];
  let tickHandle = null;
  let editingId = null;

  /* ---------- Vorlagen (im Code definiert) ----------
   * startOffset / endOffset: Dezimalstunden ab jetzt.
   * startTime / endTime (optional, "HH:MM"): werden auf das aus dem Offset
   *   berechnete Datum aufgesetzt (gleicher Tag), falls angegeben.
   * startDay/startMonth/startYear, endDay/endMonth/endYear (optional):
   *   Konkretes Datum. Wenn gesetzt, wird das Offset-Basis-Datum überschrieben.
   *   - startYear/startMonth/startDay -> setzt das Datum des Starts
   *   - endYear/endMonth/endDay     -> setzt das Datum des Endes
   *   Werden nur teilweise gesetzt, werden fehlende Teile aus dem Offset-Datum
   *   übernommen. startMonth/endMonth sind 1-basiert (1 = Januar).
   */
  const countdownTemplates = [
    {
      title: 'Feierabend',
      startOffset: 0,
      startTime: '08:00',
      endOffset: 0,
      endTime: '16:30',
      repeat: false
    },
    {
      title: 'Silvester-Countdown',
	  startDay: 1,
	  startMonth: 1,
      startOffset: 0,
      startTime: '00:00',
	  endDay: 31,
	  endMonth: 12,
      endTime: '23:59',
      repeat: false
    },
    {
      title: 'Weihnachten (24.12.)',
      startOffset: 0,
      startTime: '00:00',
      startDay: 24,
      startMonth: 12,
      endTime: '23:59',
      endDay: 24,
      endMonth: 12,
      repeat: false
    },
    {
      title: 'Neujahr (1.1.)',
      startOffset: 0,
      startTime: '00:00',
      startDay: 1,
      startMonth: 1,
      endTime: '23:59',
      endDay: 1,
      endMonth: 1,
      repeat: false
    }
  ];

  /* ---------- IndexedDB ---------- */
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) {
          d.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function tx(mode) {
    return db.transaction(STORE, mode).objectStore(STORE);
  }
  function dbGetAll() {
    return new Promise((resolve, reject) => {
      const req = tx('readonly').getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function dbAdd(obj) {
    return new Promise((resolve, reject) => {
      const req = tx('readwrite').add(obj);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function dbPut(obj) {
    return new Promise((resolve, reject) => {
      const req = tx('readwrite').put(obj);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function dbDelete(id) {
    return new Promise((resolve, reject) => {
      const req = tx('readwrite').delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  /* ---------- Bildverarbeitung ---------- */
  function processImage(file) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) return reject(new Error('Keine Bilddatei'));
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const MAX = 640;
        let { width: w, height: h } = img;
        const scale = Math.min(MAX / w, MAX / h, 1);
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('WebP-Erstellung fehlgeschlagen'));
        }, 'image/webp', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht geladen werden')); };
      img.src = url;
    });
  }

  /* ---------- Datum/Zeit Helfer ---------- */
  function toLocalInputValue(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }
  function parseInputValue(str) { return new Date(str).getTime(); }

  function fmt(dateMs) {
    const d = new Date(dateMs);
    return d.toLocaleString('de-DE', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  /* ---------- Logik: Wiederholung ---------- */
  function maybeRepeat(c) {
    if (!c.repeat) return null;
    const now = Date.now();
    if (now < c.end) return null;

    const origStart = new Date(c.start);
    const duration = c.end - c.start;
    if (duration <= 0) return null;

    const nowDate = new Date(now);
    const newStart = new Date(
      nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate(),
      origStart.getHours(), origStart.getMinutes(), origStart.getSeconds(), origStart.getMilliseconds()
    );

    const sameDayAsOrigStart =
      nowDate.getFullYear() === origStart.getFullYear() &&
      nowDate.getMonth() === origStart.getMonth() &&
      nowDate.getDate() === origStart.getDate();

    if (sameDayAsOrigStart) {
      newStart.setDate(newStart.getDate() + 1);
    }

    if (newStart.getTime() <= now) {
      newStart.setDate(newStart.getDate() + 1);
    }

    const newStartMs = newStart.getTime();
    const newEndMs = newStartMs + duration;

    if (newEndMs <= now) {
      newStart.setDate(newStart.getDate() + 1);
      return {
        start: newStart.getTime(),
        end: newStart.getTime() + duration
      };
    }

    return { start: newStartMs, end: newEndMs };
  }

  /* ---------- Rendering ---------- */
  const cardsEl = document.getElementById('cards');

    function render() {
    cardsEl.innerHTML = '';
    if (countdowns.length === 0) {
      const div = document.createElement('div');
      div.className = 'empty';
      div.textContent = 'Noch keine Countdowns – erstelle deinen ersten!';
      cardsEl.appendChild(div);
      return;
    }
    // Sortierung nach Endzeitpunkt aufsteigend:
    // Wer zuerst fertig wird, steht oben – beendete Countdowns also ganz oben.
    const sorted = [...countdowns].sort((a, b) => a.end - b.end);
    for (const c of sorted) {
      cardsEl.appendChild(buildCard(c));
    }
    updateAllClocks();
  }

  function buildCard(c) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = c.id;

    if (c.imageBlob) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.alt = '';
      const url = URL.createObjectURL(c.imageBlob);
      img.src = url;
      img.onload = () => URL.revokeObjectURL(url);
      card.appendChild(img);
    } else {
      const img = document.createElement('div');
      img.className = 'thumb';
      card.appendChild(img);
    }

    const body = document.createElement('div');
    body.className = 'body';

    const titleRow = document.createElement('div');
    titleRow.className = 'title-row';
    const h2 = document.createElement('h2');
    h2.textContent = c.title;
    titleRow.appendChild(h2);
    if (c.repeat) {
      const badge = document.createElement('span');
      badge.className = 'repeat-badge';
      badge.textContent = '↻ täglich';
      titleRow.appendChild(badge);
    }
    body.appendChild(titleRow);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span>${fmt(c.start)} - ${fmt(c.end)}</span>`;
    body.appendChild(meta);

    const clock = document.createElement('div');
    clock.className = 'clock';
    body.appendChild(clock);

    const status = document.createElement('div');
    status.className = 'status';
    status.style.display = 'none';
    body.appendChild(status);

    const progressWrap = document.createElement('div');
    progressWrap.className = 'progress-wrap';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    progressWrap.appendChild(fill);
    body.appendChild(progressWrap);

    card.appendChild(body);

    const edit = document.createElement('button');
    edit.className = 'edit';
    edit.title = 'Bearbeiten';
    edit.textContent = '✎';
    edit.addEventListener('click', (e) => {
      e.stopPropagation();
      startEdit(c.id);
    });
    card.appendChild(edit);

    const del = document.createElement('button');
    del.className = 'del';
    del.title = 'Löschen';
    del.textContent = '✕';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (confirm('Diesen Countdown wirklich löschen?')) {
        await dbDelete(c.id);
        countdowns = countdowns.filter(x => x.id !== c.id);
        if (editingId === c.id) {
          editingId = null;
          resetFormDefaults();
          hideForm();
        }
        render();
        updateAddBtn();
      }
    });
    card.appendChild(del);

    return card;
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function updateAllClocks() {
    const now = Date.now();
    for (const c of countdowns) {
      const card = cardsEl.querySelector(`.card[data-id="${c.id}"]`);
      if (!card) continue;
      const clock = card.querySelector('.clock');
      const status = card.querySelector('.status');
      const fill = card.querySelector('.progress-fill');

      if (now < c.start) {
        clock.style.display = 'none';
        fill.parentElement.style.display = 'none';
        status.style.display = '';
        status.className = 'status waiting';
        status.textContent = 'Ausstehend';
        const diff = c.start - now;
        status.title = 'Startet in ' + humanDiff(diff);
      } else if (now >= c.end) {
        clock.style.display = 'none';
        fill.parentElement.style.display = 'none';
        status.style.display = '';
        status.className = 'status expired';
        status.textContent = 'Abgelaufen';
        status.title = '';
      } else {
        status.style.display = 'none';
        clock.style.display = '';
        fill.parentElement.style.display = '';
        const remaining = c.end - now;
        clock.innerHTML = formatClock(remaining);
        const total = c.end - c.start;
        const pct = Math.min(100, Math.max(0, ((now - c.start) / total) * 100));
        fill.style.width = pct.toFixed(2) + '%';
      }
    }
  }

  function humanDiff(ms) {
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    return `${d}d ${h}h ${m}m`;
  }

  function formatClock(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const d = Math.floor(totalSec / 86400);
    const h = Math.floor((totalSec % 86400) / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    let out = '';
    if (d > 0) out += `${d}<small>d</small> `;
    out += `${pad2(h)}<small>h</small> ${pad2(m)}<small>m</small> ${pad2(s)}<small>s</small>`;
    return out;
  }

  /* ---------- Tick & Wiederholung ---------- */
  async function tick() {
    let changed = false;
    for (const c of countdowns) {
      const rep = maybeRepeat(c);
      if (rep) {
        c.start = rep.start;
        c.end = rep.end;
        changed = true;
        await dbPut(c);
      }
    }
    if (changed) render();
    updateAllClocks();
  }

  /* ---------- Formular Steuerung ---------- */
  const formPanel = document.getElementById('formPanel');
  const addBtn = document.getElementById('addBtn');
  const form = document.getElementById('createForm');
  const titleInput = document.getElementById('title');
  const startInput = document.getElementById('start');
  const endInput = document.getElementById('end');
  const repeatInput = document.getElementById('repeat');
  const dropzone = document.getElementById('dropzone');
  const dropText = document.getElementById('dropText');
  const fileInput = document.getElementById('fileInput');
  const submitBtn = document.getElementById('submitBtn');
  const templateSelect = document.getElementById('templateSelect');

  /* ---------- Vorlagen-Dropdown ---------- */
  function renderTemplateOptions() {
    while (templateSelect.options.length > 1) {
      templateSelect.remove(1);
    }
    countdownTemplates.forEach((tpl, idx) => {
      const opt = document.createElement('option');
      opt.value = String(idx);
      opt.textContent = tpl.title;
      templateSelect.appendChild(opt);
    });
  }

  function parseHHMM(str) {
    if (!str || typeof str !== 'string') return null;
    const m = str.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const h = parseInt(m[1], 10);
    const min = parseInt(m[2], 10);
    if (h < 0 || h > 23 || min < 0 || min > 59) return null;
    return { h, min };
  }

  function isValidInt(v) {
    return typeof v === 'number' && Number.isFinite(v) && Number.isInteger(v);
  }

  function applyTemplate(tpl) {
    const now = new Date();

    // 1. Basis-Startdatum: jetzt + startOffset (in Dezimalstunden)
    const startDate = new Date(now.getTime() + (tpl.startOffset || 0) * 3600 * 1000);

    // 2. Konkretes Startdatum aus startYear/startMonth/startDay anwenden
    //    (nur die gesetzten Teile überschreiben; Monat 1-basiert)
    if (isValidInt(tpl.startYear)) startDate.setFullYear(tpl.startYear);
    if (isValidInt(tpl.startMonth)) startDate.setMonth(tpl.startMonth - 1);
    if (isValidInt(tpl.startDay)) startDate.setDate(tpl.startDay);

    // 3. Optional startTime auf das Startdatum aufsetzen
    const st = parseHHMM(tpl.startTime);
    if (st) {
      startDate.setHours(st.h, st.min, 0, 0);
    } else if (!isValidInt(tpl.startDay) && !isValidInt(tpl.startMonth) && !isValidInt(tpl.startYear)) {
      // Ohne konkretes Datum und ohne startTime bleibt die Uhrzeit von "jetzt + offset"
      // -> nichts weiter zu tun
    }

    // 4. Basis-Enddatum: jetzt + endOffset (in Dezimalstunden)
    const endDate = new Date(now.getTime() + (tpl.endOffset || 0) * 3600 * 1000);

    // 5. Konkretes Enddatum aus endYear/endMonth/endDay anwenden
    if (isValidInt(tpl.endYear)) endDate.setFullYear(tpl.endYear);
    if (isValidInt(tpl.endMonth)) endDate.setMonth(tpl.endMonth - 1);
    if (isValidInt(tpl.endDay)) endDate.setDate(tpl.endDay);

    // 6. Optional endTime auf das Enddatum aufsetzen
    const et = parseHHMM(tpl.endTime);
    if (et) {
      endDate.setHours(et.h, et.min, 0, 0);
    }

    // 7. Falls endDate <= startDate: ggf. Jahr weiterdrehen oder +1 Tag.
    //    Bei konkreten Datumsangaben (endDay/endMonth ohne Jahr) kann es sein,
    //    dass das Enddatum im nächsten Jahr liegt -> dann Jahr erhöhen.
    if (endDate.getTime() <= startDate.getTime()) {
      if (isValidInt(tpl.endDay) || isValidInt(tpl.endMonth)) {
        // konkretes Enddatum liegt "hinter" dem Start -> nächstes Jahr
        endDate.setFullYear(endDate.getFullYear() + 1);
      } else if (isValidInt(tpl.startDay) || isValidInt(tpl.startMonth)) {
        // Startdatum konkret in der Vergangenheit? -> ein Jahr weiter
        startDate.setFullYear(startDate.getFullYear() + 1);
        // Enddatum ggf. auch anpassen, falls es ohne konkretes Datum war
        if (!isValidInt(tpl.endDay) && !isValidInt(tpl.endMonth)) {
          endDate.setFullYear(startDate.getFullYear());
        }
      } else if (et) {
        endDate.setDate(endDate.getDate() + 1);
      } else {
        endDate.setTime(startDate.getTime() + 60 * 1000);
      }
    }

    // 8. Falls das konkrete Startdatum (ohne Jahr) bereits in der Vergangenheit
    //    liegt und kein konkretes Enddatum vorhanden ist -> Jahr weiterdrehen.
    if ((isValidInt(tpl.startDay) || isValidInt(tpl.startMonth)) && !isValidInt(tpl.startYear)) {
      if (startDate.getTime() < now.getTime() && !isValidInt(tpl.endDay) && !isValidInt(tpl.endMonth)) {
        startDate.setFullYear(startDate.getFullYear() + 1);
        endDate.setFullYear(endDate.getFullYear() + 1);
      }
    }

    // 9. Sicherheitscheck: Ende muss nach Start liegen
    if (endDate.getTime() <= startDate.getTime()) {
      endDate.setTime(startDate.getTime() + 60 * 1000);
    }

    titleInput.value = tpl.title;
    startInput.value = toLocalInputValue(startDate);
    endInput.value = toLocalInputValue(endDate);
    repeatInput.checked = !!tpl.repeat;

    titleInput.focus();
    titleInput.select();
  }

  templateSelect.addEventListener('change', () => {
    const val = templateSelect.value;
    if (val === '') return;
    const tpl = countdownTemplates[parseInt(val, 10)];
    if (tpl) applyTemplate(tpl);
  });

  function resetFormDefaults() {
    const now = new Date();
    const end = new Date(now.getTime() + 5 * 60 * 1000);
    startInput.value = toLocalInputValue(now);
    endInput.value = toLocalInputValue(end);
    titleInput.value = 'Neuer Countdown';
    repeatInput.checked = false;
    templateSelect.value = '';
    clearImage();
  }

  function showForm() {
    formPanel.classList.remove('hidden');
    addBtn.classList.remove('visible');
    if (!startInput.value) {
      resetFormDefaults();
    }
    titleInput.focus();
    titleInput.select();
  }

  function hideForm() {
    formPanel.classList.add('hidden');
    updateAddBtn();
  }

  function updateAddBtn() {
    const has = countdowns.length > 0;
    addBtn.classList.toggle('visible', has);
  }

  function clearImage() {
    currentImageBlob = null;
    if (currentImageUrl) {
      URL.revokeObjectURL(currentImageUrl);
      currentImageUrl = null;
    }
    dropzone.querySelectorAll('img.preview').forEach(el => el.remove());
    dropText.style.display = '';
  }

  function setImagePreview(blob) {
    clearImage();
    currentImageBlob = blob;
    currentImageUrl = URL.createObjectURL(blob);
    dropText.style.display = 'none';
    const img = document.createElement('img');
    img.className = 'preview';
    img.src = currentImageUrl;
    dropzone.appendChild(img);
  }

  async function handleFile(file) {
    try {
      const blob = await processImage(file);
      setImagePreview(blob);
    } catch (err) {
      alert('Bild konnte nicht verarbeitet werden: ' + err.message);
    }
  }

  function startEdit(id) {
    const c = countdowns.find(x => x.id === id);
    if (!c) return;
    editingId = id;

    titleInput.value = c.title;
    startInput.value = toLocalInputValue(new Date(c.start));
    endInput.value = toLocalInputValue(new Date(c.end));
    repeatInput.checked = !!c.repeat;
    templateSelect.value = '';

    if (c.imageBlob) {
      setImagePreview(c.imageBlob);
    } else {
      clearImage();
    }

    submitBtn.textContent = 'Änderungen speichern';
    formPanel.classList.remove('hidden');
    addBtn.classList.remove('visible');
    formPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    titleInput.focus();
    titleInput.select();
  }

  // Datei Input
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    fileInput.value = '';
  });

  // Drag & Drop
  ['dragenter', 'dragover'].forEach(ev => {
    dropzone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave', 'drop'].forEach(ev => {
    dropzone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // Strg+V global
  document.addEventListener('paste', (e) => {
    if (formPanel.classList.contains('hidden')) return;
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) {
          handleFile(file);
          e.preventDefault();
          break;
        }
      }
    }
  });

  // Add Button
  addBtn.addEventListener('click', () => {
    editingId = null;
    submitBtn.textContent = 'Countdown erstellen';
    resetFormDefaults();
    showForm();
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    editingId = null;
    submitBtn.textContent = 'Countdown erstellen';
    resetFormDefaults();
    hideForm();
    if (countdowns.length === 0) {
      showForm();
    }
  });

  // Submit (Neu + Bearbeiten)
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = titleInput.value.trim() || 'Neuer Countdown';
    const start = parseInputValue(startInput.value);
    const end = parseInputValue(endInput.value);
    if (isNaN(start) || isNaN(end)) { alert('Bitte gültige Datum/Zeit-Werte angeben.'); return; }
    if (end <= start) { alert('Das Ende muss nach dem Start liegen.'); return; }

    if (editingId !== null) {
      const idx = countdowns.findIndex(x => x.id === editingId);
      if (idx === -1) { editingId = null; return; }
      const existing = countdowns[idx];
      const updated = {
        ...existing,
        title,
        start,
        end,
        repeat: repeatInput.checked,
        imageBlob: currentImageBlob
      };
      await dbPut(updated);
      countdowns[idx] = updated;

      editingId = null;
      submitBtn.textContent = 'Countdown erstellen';
      resetFormDefaults();
      hideForm();
      render();
      updateAddBtn();
      return;
    }

    const record = {
      title,
      start,
      end,
      repeat: repeatInput.checked,
      imageBlob: currentImageBlob,
      createdAt: Date.now()
    };
    const id = await dbAdd(record);
    record.id = id;
    countdowns.push(record);

    resetFormDefaults();
    hideForm();
    render();
    updateAddBtn();
  });

  /* ---------- Init ---------- */
  async function init() {
    db = await openDB();
    countdowns = await dbGetAll();
    renderTemplateOptions();
    render();
    updateAddBtn();

    if (countdowns.length === 0) {
      resetFormDefaults();
      formPanel.classList.remove('hidden');
      addBtn.classList.remove('visible');
    } else {
      formPanel.classList.add('hidden');
      updateAddBtn();
    }

    tickHandle = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) tick();
    });
  }

  init();
})();
</script>
</body>
</html>
